[package]
name = "core_worker"
version = "0.2.0"
edition = "2024"
description = "High-concurrency asynchronous Rust fetching engine for the scraping pipeline"

[features]
default = []
# Opt-in TLS/HTTP2 fingerprint impersonation (Chrome/Firefox/Safari JA3/JA4).
# Requires cmake + NASM + perl + go on the build machine because the crate
# vendors BoringSSL.  The default build stays on rustls and needs none of it.
tls-impersonate = ["dep:wreq", "dep:wreq-util"]

[dependencies]
# Async multi-threaded runtime (Substep 2.1)
tokio = { version = "1", features = ["full"] }
# Non-blocking HTTP client with streaming bodies (Substep 2.1)
# Uses rustls so we can tune TLS parameters to mimic browser fingerprints.
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "gzip", "brotli", "deflate", "charset", "http2", "cookies", "socks", "json"] }
# Fast serialization / deserialization (Substep 2.1)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# HTTP surface so the TypeScript gateway can push work into the core queue
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Utilities
anyhow = "1"
thiserror = "2"
url = "2"
rand = "0.9"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
# Adaptive throttle — exponential moving average over response latencies
parking_lot = "0.12"
# Lightweight synchronisation primitive for proxy rotation counter
once_cell = "1"
# Genuine browser TLS/HTTP2 fingerprints (BoringSSL under the hood).
wreq = { version = "0.15.3", optional = true, features = ["cookies"] }
wreq-util = { version = "0.1.0", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
